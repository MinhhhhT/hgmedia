version: 1

defaults:
  fail_dag_on_severity: [critical]
  unexpected_sample_limit: 20

rule_templates:
  table_has_rows: &table_has_rows
    id: table_has_rows
    expectation: ExpectTableRowCountToBeBetween
    kwargs: {min_value: 1}
    severity: warning
  primary_key_not_null: &primary_key_not_null
    id: primary_key_not_null
    expectation: ExpectColumnValuesToNotBeNull
    severity: critical
  primary_key_unique: &primary_key_unique
    id: primary_key_unique
    expectation: ExpectColumnValuesToBeUnique
    severity: critical
  silver_table: &silver_table
    enabled: true
    layer: silver
    owner: data-team
    rules: [*table_has_rows]
  gold_table: &gold_table
    enabled: true
    layer: gold
    owner: analytics
    rules: [*table_has_rows]

tables:
  silver.bridge_bt_vid: {<<: *silver_table, dbt_model: bridge_bt_vid}
  silver.dim_artist_distro: {<<: *silver_table, dbt_model: dim_artist_distro}
