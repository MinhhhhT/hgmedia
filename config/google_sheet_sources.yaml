# =============================================================================
# GOOGLE SHEET SOURCES — CONFIG MẪU (placeholder, thay spreadsheet_id thật khi triển khai)
# =============================================================================
google_sheet_sources:

  - source_id: "partners"
    source_type: "google_sheet"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.partners.csv"
    description: "Danh mục đối tác (Thông tin các kho nhạc BD)"
    spreadsheet_id: "${GSHEET_PARTNERS_PURCHASE_COST_ID}"
    worksheet_pattern: "Thông tin các kho nhạc BD"
    header_row: 2
    data_start_row: 3
    target_staging_table: "staging.partners"
    load_mode: "truncate"
    stream_to_staging: false

  - source_id: "purchased_resource"
    source_type: "google_sheet"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.purchased_resource.csv"
