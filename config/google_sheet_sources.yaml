    worksheet_name: null
    header_row: 1
    data_start_row: 4
    target_staging_table: "staging.purchased_resource"
    load_mode: "truncate"
    stream_to_staging: false

  - source_id: "purchase_cost"
    source_type: "google_sheet"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.purchase_cost.csv"
    spreadsheet_id: "${GSHEET_PARTNERS_PURCHASE_COST_ID}"
    worksheet_pattern: "Theo dõi CP thực (Kế toán)"
    header_row: 3
    data_start_row: 4
    columns:
      - "Tên đối tác"
      - "Dòng nhạc"
      - "Team sử dụng"
      - "Số bài hát"
      - "Đơn vị tiền tệ"
      - "CP tháng 1"
      - "CP tháng 2"
      - "CP tháng 3"
      - "CP tháng 4"
      - "CP tháng 5"
      - "CP tháng 6"
      - "CP tháng 7"
      - "CP tháng 8"
      - "CP tháng 9"
      - "CP tháng 10"
      - "CP tháng 11"
      - "CP tháng 12"
      - "Total năm"
    target_staging_table: "staging.purchase_cost"
    load_mode: "truncate"
    stream_to_staging: false

  - source_id: "resource_before_odoo"
