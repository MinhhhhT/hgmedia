    source_type: "google_sheet"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.resource_performance.csv"
    connection: "google_sheet"
    folder_id: "${GDRIVE_RESOURCE_PERFORMANCE_FOLDER_ID}"
    file_name: "HG_Check_Data_No_Info.xlsx"
    worksheet_name: "Tùng nhập An - Dữ liệu bổ sung"
    header_key: "ưu tiên"
    columns:
      - "Ưu tiên"
      - "Mã Stock"
      - "Tên bài"
      - "ISRC chốt"
      - "ISRC (An)"
      - "ISRC (Stock cũ)"
