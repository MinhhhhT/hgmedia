elastic_sources:
  - source_id: "channel_video_info"
    source_type: "elastic"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.channel_video_info.csv"
    connection: "elastic"
    es_index: "channel-video-info"
    date_field: "PublishedAt"
    page_size: 5000
    sort_field: "YoutubeVideoId.keyword"
    target_staging_table: "staging.channel_video_info"
    load_mode: "truncate"
    stream_to_staging: false

  - source_id: "channel_video_metric"
    source_type: "elastic"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.channel_video_metric.csv"
    connection: "elastic"
    es_index: "channel-video-metric-*"
    date_field: "Date"
    date_from: "2025-06-01"
    page_size: 5000
    sort_field: "CompositeId.keyword"
    target_staging_table: "staging.channel_video_metric"
    load_mode: "truncate"
    stream_to_staging: false
