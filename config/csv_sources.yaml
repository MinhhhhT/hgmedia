csv_sources:
  - source_id: "stream_distro"
    source_type: "csv"
    fixture_csv: "${STREAM_DISTRO_FIXTURE_PATH:-source_replicas/fixtures/staging.stream_distro.csv}"
    file_path: "${STREAM_DISTRO_PATH:-data/fact_view_stream.csv}"
    sep: ","
    target_staging_table: "staging.stream_distro"
    load_mode: "truncate"
    stream_to_staging: false
    chunksize: 5000
  - source_id: "usd_rate"
    source_type: "fx"
    fixture_csv: "${LOCAL_FIXTURE_DIR:-exports/hgmediadb_samples_1000_20260828_000045}/staging.usd_rate.csv"
    start_date: "2025-06-01"
    currency: "vnd"
    target_staging_table: "staging.usd_rate"
    load_mode: "truncate"
    stream_to_staging: false
    batch_days: 30
